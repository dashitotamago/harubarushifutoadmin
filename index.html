<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shifly - 管理者</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; background:#f8fafc; color:#0f172a; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  a.back { font-size:12px; color:#94a3b8; text-decoration:none; }
  h2 { font-size:16px; margin: 0 0 14px; }
  h3 { font-size:14px; margin: 0 0 10px; }
  label { display:block; font-size:12px; color:#64748b; margin-bottom:4px; }
  input, select { border:1px solid #cbd5e1; border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  input:not([type=checkbox]) { width:100%; margin-bottom:10px; }
  button { background:#0d9488; color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#334155; border:1px solid #cbd5e1; }
  button.danger { background:#fef2f2; color:#e11d48; }
  button.small { padding:5px 9px; font-size:12px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:16px; margin-bottom:16px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .logout { font-size:12px; color:#94a3b8; background:none; border:none; cursor:pointer; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab { padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer; background:#fff; border:1px solid #e2e8f0; color:#64748b; }
  .tab.active { background:#0f172a; color:#fff; border-color:#0f172a; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #f1f5f9; }
  th { color:#94a3b8; font-size:11px; text-transform:uppercase; }
  .hidden { display:none; }
  .error { color:#e11d48; font-size:12px; margin: -6px 0 10px; }
  .muted { color:#94a3b8; font-size:12px; }
  .navrow { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .datebar { display:flex; align-items:center; gap:6px; border:1px solid #e2e8f0; border-radius:8px; padding:6px 10px; background:#fff; }
  #loading { text-align:center; color:#94a3b8; padding:60px 0; font-size:13px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px; }
  .badge.ok { background:#f0fdfa; color:#0d9488; }
  .badge.no { background:#f1f5f9; color:#94a3b8; }

  /* 横棒シフトグリッド */
  .gridwrap { overflow-x:auto; }
  .gridinner { min-width:900px; }
  .ghead { display:flex; border-bottom:1px solid #f1f5f9; }
  .gnamecol { width:150px; flex-shrink:0; padding:8px 10px; font-size:11px; color:#94a3b8; font-weight:600; }
  .ghours { display:flex; flex:1; }
  .ghour { flex:1; text-align:center; font-size:10px; color:#94a3b8; padding:6px 0; border-left:1px solid #f8fafc; }
  .growrap { display:flex; border-bottom:1px solid #f8fafc; }
  .gname { width:150px; flex-shrink:0; padding:10px; }
  .gname .n { font-size:12px; font-weight:700; color:#334155; }
  .gname .w { font-size:10px; color:#94a3b8; }
  .gtrack { position:relative; flex:1; padding:8px 0; cursor:pointer; }
  .glines { position:absolute; inset:0; display:flex; pointer-events:none; }
  .gline { flex:1; border-left:1px solid #f8fafc; }
  .gasn { position:relative; height:28px; margin-bottom:3px; }
  .gasnbar {
    position:absolute; top:0; height:28px; background:#dcfce7; border:1px solid #4ade80; border-radius:4px;
    font-size:11px; font-weight:700; color:#166534; line-height:26px; padding:0 6px; overflow:hidden; white-space:nowrap; cursor:pointer;
  }
  .gasnbar:hover { background:#bbf7d0; }
  .gasnbreak { position:absolute; top:0; height:28px; background:rgba(255,255,255,.65); border-left:1px dashed #4ade80; border-right:1px dashed #4ade80; pointer-events:none; }
  .greq { position:relative; height:22px; }
  .greqbar {
    position:absolute; top:0; height:22px; background:transparent; border-top:1px solid #cbd5e1;
    font-size:10px; color:#64748b; line-height:12px; padding-top:2px; overflow:hidden; white-space:nowrap;
  }
  .greqbar .memo { font-size:9px; color:#94a3b8; white-space:normal; }
  .glegend { display:flex; gap:14px; font-size:11px; color:#94a3b8; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .glegend .sw { display:inline-block; width:16px; height:8px; border-radius:3px; vertical-align:middle; margin-right:4px; }

  /* シフト編集モーダル */
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.4); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal-box { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:340px; }
  .modal-box h3 { margin-top:0; }
  .modal-actions { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .modal-overlay.hidden { display:none; }

  /* 2週間・1ヶ月テーブル */
  #periodTable th, #periodTable td { text-align:center; white-space:nowrap; font-size:11px; padding:6px 8px; }
  #periodTable th:first-child, #periodTable td:first-child { text-align:left; position:sticky; left:0; background:#fff; min-width:130px; }
  #periodTable td.pcell.on { background:#f0fdfa; color:#0f766e; font-weight:600; }
  #periodTable .pname { font-weight:700; color:#334155; font-size:12px; }
  #periodTable .phours { font-size:10px; color:#0d9488; }
</style>
</head>
<body>
<div class="wrap">
  
  <div id="loading">読み込み中...</div>

  <div id="loginView" class="hidden" style="max-width:360px; margin:60px auto;">
    <h2>🛡️ 管理者ログイン</h2>
    <label>管理者パスワード</label>
    <input id="adminPw" type="password" />
    <div class="muted" style="margin-bottom:10px;">初期パスワード: admin123</div>
    <div id="loginError" class="error hidden"></div>
    <button onclick="doAdminLogin()">ログイン</button>
  </div>

  <div id="mainView" class="hidden">
    <div class="top">
      <h2 style="margin:0">管理画面</h2>
      <button class="logout" onclick="logout()">ログアウト</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="grid" onclick="switchTab('grid')">シフト管理</div>
      <div class="tab" data-tab="settings" onclick="switchTab('settings')">設定</div>
    </div>

    <!-- シフト管理 -->
    <div id="tab-grid">
      <div class="tabs" style="margin-bottom:12px;">
        <div class="tab active" data-view="day" onclick="switchGridView('day')">日別</div>
        <div class="tab" data-view="2week" onclick="switchGridView('2week')">前半・後半</div>
        <div class="tab" data-view="month" onclick="switchGridView('month')">1ヶ月</div>
      </div>

      <!-- 日別表示 -->
      <div id="dayView">
        <div class="navrow">
          <button class="secondary small" onclick="gridChangeDay(-1)">←</button>
          <div class="datebar">
            <input id="gridDate" type="date" onchange="renderGrid()" />
          </div>
          <button class="secondary small" onclick="gridChangeDay(1)">→</button>
          <button class="secondary small" onclick="gridToday()">今日</button>
        </div>
        <div class="card gridwrap">
          <div class="gridinner">
            <div class="ghead">
              <div class="gnamecol">スタッフ</div>
              <div class="ghours" id="ghours"></div>
            </div>
            <div id="gridRows"></div>
          </div>
        </div>
        <div class="glegend">
          <span><span class="sw" style="background:#dcfce7; border:1px solid #4ade80"></span>確定シフト(白い切れ目=休憩)</span>
          <span><span class="sw" style="background:transparent; border-top:1px solid #cbd5e1"></span>希望シフト</span>
          <span>帯の空いている場所をクリックで確定シフト追加、緑の帯をクリックで編集・削除</span>
        </div>
      </div>

      <!-- 2週間・1ヶ月表示 -->
      <div id="periodView" class="hidden">
        <div class="navrow">
          <button class="secondary small" onclick="periodChange(-1)">←</button>
          <div id="periodLabel" style="font-weight:600; font-size:14px;"></div>
          <button class="secondary small" onclick="periodChange(1)">→</button>
          <button class="secondary small" onclick="periodToday()">今日</button>
        </div>
        <div class="card gridwrap">
          <table id="periodTable" style="min-width:max-content;">
            <thead><tr id="periodHeadRow"></tr></thead>
            <tbody id="periodBody"></tbody>
          </table>
        </div>
        <p class="muted">スタッフ名の横の時間は、この期間の確定シフト合計時間(休憩を除く)です。セルは各日の確定シフトの時間帯です。</p>
      </div>
    </div>

    <!-- シフト編集モーダル -->
    <div id="shiftModal" class="modal-overlay hidden" style="display:none;">
      <div class="modal-box">
        <h3 id="shiftModalTitle">確定シフト</h3>
        <label>開始時刻</label>
        <input type="time" id="modalStart" />
        <label>終了時刻</label>
        <input type="time" id="modalEnd" />
        <label style="display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="modalHasBreak" style="width:auto; margin:0;" onchange="toggleModalBreak()" /> 休憩時間を設定する
        </label>
        <div id="modalBreakRow" class="hidden">
          <div class="row">
            <div style="flex:1"><label>休憩開始</label><input type="time" id="modalBreakStart" /></div>
            <div style="flex:1"><label>休憩終了</label><input type="time" id="modalBreakEnd" /></div>
          </div>
        </div>
        <div id="modalError" class="error hidden"></div>
        <div class="modal-actions">
          <button class="danger small" id="modalDeleteBtn" onclick="deleteFromModal()">削除</button>
          <div>
            <button class="secondary small" onclick="closeModal()">閉じる</button>
            <button class="small" onclick="saveFromModal()">保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 設定 -->
    <div id="tab-settings" class="hidden">
      <div class="card">
        <h3>管理者パスワード変更</h3>
        <label>新しいパスワード</label>
        <input id="newAdminPw" type="password" />
        <button onclick="changeAdminPw()">変更する</button>
      </div>
      <div class="card">
        <h3>打刻端末パスコード</h3>
        <p class="muted">店舗のiPadなど、打刻を許可する端末にだけこのパスコードを伝えてください。</p>
        <label>パスコード</label>
        <input id="newPasscode" />
        <button onclick="changePasscode()">変更する</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxsZsfXntcB4-0HNzkqGz41TYNEENegI3Penhs7LcmMK8hVaAIUWxxLSCn0RJAEK8wKDw/exec";
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function yen(n) {
  return "¥" + Math.round(Number(n) || 0).toLocaleString("ja-JP");
}
function toMin(hhmm) {
  if (!hhmm) return 0;
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
async function apiCall(url, action, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload: payload || {} }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "unknown error");
  return json.data;
}

let staffList = [];
let gridDateVal = todayStr();

function init() {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
}
init();

async function doAdminLogin() {
  const pw = document.getElementById("adminPw").value;
  const errEl = document.getElementById("loginError");
  errEl.classList.add("hidden");
  try {
    const result = await apiCall(API_URL, "adminLogin", { password: pw });
    if (!result.ok) {
      errEl.textContent = "パスワードが違います。";
      errEl.classList.remove("hidden");
      return;
    }
    staffList = await apiCall(API_URL, "getStaffList"); // ログイン後に1回だけ取得し、以後は使い回す
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("mainView").classList.remove("hidden");
    document.getElementById("gridDate").value = gridDateVal;
    renderGrid(); // 最初に表示されるタブの分だけ読み込む(他タブはクリック時に読み込む)
  } catch (e) {
    errEl.textContent = "通信エラー: " + e.message + "(Apps Scriptの公開設定を確認してください)";
    errEl.classList.remove("hidden");
  }
}

function logout() {
  document.getElementById("mainView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
  document.getElementById("adminPw").value = "";
}

function switchTab(key) {
  document.querySelectorAll(".tab[data-tab]").forEach((t) => t.classList.toggle("active", t.dataset.tab === key));
  ["grid", "settings"].forEach((k) => {
    document.getElementById("tab-" + k).classList.toggle("hidden", k !== key);
  });
  // タブを開いたときだけ、そのタブに必要なデータを取りに行く(他タブ分は読み込まない)
  if (key === "grid") {
    if (gridViewMode === "day") renderGrid();
    else renderPeriod();
  }
}

/* ---- シフト管理(横棒グリッド表示) ---- */
const GRID_START_HOUR = 9;
const GRID_END_HOUR = 24;
const GRID_HOURS = Array.from({ length: GRID_END_HOUR - GRID_START_HOUR }, (_, i) => GRID_START_HOUR + i);
const GRID_RANGE_MIN = (GRID_END_HOUR - GRID_START_HOUR) * 60;

function gridChangeDay(n) {
  gridDateVal = addDays(document.getElementById("gridDate").value || gridDateVal, n);
  document.getElementById("gridDate").value = gridDateVal;
  renderGrid();
}
function gridToday() {
  gridDateVal = todayStr();
  document.getElementById("gridDate").value = gridDateVal;
  renderGrid();
}

function gridClampMin(min) {
  return Math.max(GRID_START_HOUR * 60, Math.min(GRID_END_HOUR * 60, min));
}
function gridPos(start, end) {
  const left = ((gridClampMin(toMin(start)) - GRID_START_HOUR * 60) / GRID_RANGE_MIN) * 100;
  const width = ((gridClampMin(toMin(end)) - gridClampMin(toMin(start))) / GRID_RANGE_MIN) * 100;
  return { left, width };
}

// 確定シフト1件分の実働時間(休憩を除く/時間単位)
function calcHours(a) {
  const breakMin = (a.breakStart && a.breakEnd) ? Math.max(0, toMin(a.breakEnd) - toMin(a.breakStart)) : 0;
  return Math.max(0, toMin(a.end) - toMin(a.start) - breakMin) / 60;
}

let currentDayData = { shifts: [], assigned: [] };

async function renderGrid() {
  const date = document.getElementById("gridDate").value || gridDateVal;
  gridDateVal = date;

  // 時間ヘッダー
  const ghours = document.getElementById("ghours");
  ghours.innerHTML = GRID_HOURS.map((h) => `<div class="ghour">${h}時</div>`).join("");

  const rows = document.getElementById("gridRows");
  rows.innerHTML = `<div class="muted" style="padding:16px;">読み込み中...</div>`;
  try {
    currentDayData = await apiCall(API_URL, "getDayData", { date }); // その日の希望・確定シフトだけを取得
  } catch (e) {
    rows.innerHTML = `<div class="error" style="padding:16px;">読み込みに失敗しました: ${e.message}</div>`;
    return;
  }
  rows.innerHTML = "";

  staffList.forEach((s) => {
    const req = currentDayData.shifts.find((sh) => sh.staffId === s.id);
    // 万一同じスタッフ・同じ日に複数件残っていても、一番後ろ(最新)のものを優先して表示する
    const myAssigned = currentDayData.assigned.filter((a) => a.staffId === s.id);
    const asg = myAssigned.length ? myAssigned[myAssigned.length - 1] : null;
    const dayHours = myAssigned.reduce((sum, a) => sum + calcHours(a), 0);

    const row = document.createElement("div");
    row.className = "growrap";

    const reqBarHtml = (req && !req.isDayOff && req.start && req.end) ? (() => {
      const p = gridPos(req.start, req.end);
      return `<div class="greqbar" style="left:${p.left}%; width:${p.width}%">${req.start}-${req.end}${req.memo ? `<div class="memo">${req.memo}</div>` : ""}</div>`;
    })() : "";

    const asnBarHtml = asg ? (() => {
      const p = gridPos(asg.start, asg.end);
      const hasBreak = asg.breakStart && asg.breakEnd;
      const breakHtml = hasBreak ? (() => {
        const bp = gridPos(asg.breakStart, asg.breakEnd);
        // 休憩の位置は「バー全体に対する相対%」に変換して重ねる
        const relLeft = p.width > 0 ? ((bp.left - p.left) / p.width) * 100 : 0;
        const relWidth = p.width > 0 ? (bp.width / p.width) * 100 : 0;
        return `<div class="gasnbreak" style="left:${relLeft}%; width:${relWidth}%" title="休憩 ${asg.breakStart}〜${asg.breakEnd}"></div>`;
      })() : "";
      return `<div class="gasnbar" style="left:${p.left}%; width:${p.width}%" data-assigned-id="${asg.id}" onclick="event.stopPropagation(); openShiftModalById('${s.id}','${s.name.replace(/'/g, "\\'")}','${date}','${asg.id}')">${asg.start}-${asg.end}${breakHtml}</div>`;
    })() : "";

    row.innerHTML = `
      <div class="gname"><div class="n">${s.name}${dayHours > 0 ? ` <span class="phours">(${dayHours.toFixed(1)}h)</span>` : ""}</div><div class="w">${req ? (req.isDayOff ? "休み希望" : "希望あり") : "希望なし"}</div></div>
      <div class="gtrack" onclick="trackClicked(event, '${s.id}', '${s.name.replace(/'/g, "\\'")}', '${date}')">
        <div class="glines">${GRID_HOURS.map(() => '<div class="gline"></div>').join("")}</div>
        <div class="gasn">${asnBarHtml}</div>
        <div class="greq">${reqBarHtml}</div>
      </div>
    `;
    rows.appendChild(row);
  });

  if (staffList.length === 0) {
    rows.innerHTML = `<div class="muted" style="padding:16px;">「スタッフ管理」からスタッフを登録してください</div>`;
  }
}

/* ---- 2週間・1ヶ月表示 ---- */
let gridViewMode = "day"; // day | 2week | month
let periodAnchor = todayStr();

function switchGridView(mode) {
  gridViewMode = mode;
  document.querySelectorAll('.tabs .tab[data-view]').forEach((t) => t.classList.toggle("active", t.dataset.view === mode));
  document.getElementById("dayView").classList.toggle("hidden", mode !== "day");
  document.getElementById("periodView").classList.toggle("hidden", mode === "day");
  if (mode === "day") {
    renderGrid();
  } else {
    renderPeriod();
  }
}

function pad2(n) { return String(n).padStart(2, "0"); }

// 1〜15日、16日〜月末で区切った期間の日付一覧を返す
function halfPeriodDates(anchorDate) {
  const d = new Date(anchorDate + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  if (day <= 15) {
    return Array.from({ length: 15 }, (_, i) => `${y}-${pad2(m)}-${pad2(i + 1)}`);
  }
  const last = new Date(y, m, 0).getDate();
  return Array.from({ length: last - 15 }, (_, i) => `${y}-${pad2(m)}-${pad2(16 + i)}`);
}

// 半月区切りで前/次の期間の基準日を返す(dir: -1で前、1で次)
function shiftHalfPeriod(anchorDate, dir) {
  const d = new Date(anchorDate + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
  const isFirstHalf = day <= 15;
  if (dir > 0) {
    if (isFirstHalf) return `${y}-${pad2(m)}-16`;
    const nd = new Date(y, m, 1); // 翌月1日(mはJSの0始まりに対して+1されているため、そのままnew Dateへ渡すと翌月になる)
    return `${nd.getFullYear()}-${pad2(nd.getMonth() + 1)}-01`;
  }
  if (!isFirstHalf) return `${y}-${pad2(m)}-01`;
  const pd = new Date(y, m - 2, 16); // 前月16日
  return `${pd.getFullYear()}-${pad2(pd.getMonth() + 1)}-16`;
}

function periodDates() {
  if (gridViewMode === "2week") {
    return halfPeriodDates(periodAnchor);
  }
  // month
  const d = new Date(periodAnchor + "T00:00:00");
  const y = d.getFullYear(), m = d.getMonth() + 1;
  const last = new Date(y, m, 0).getDate();
  return Array.from({ length: last }, (_, i) => `${y}-${pad2(m)}-${pad2(i + 1)}`);
}

function periodChange(n) {
  if (gridViewMode === "2week") {
    periodAnchor = shiftHalfPeriod(periodAnchor, n);
  } else {
    const d = new Date(periodAnchor + "T00:00:00");
    d.setMonth(d.getMonth() + n);
    periodAnchor = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-01`;
  }
  renderPeriod();
}

function periodToday() {
  periodAnchor = todayStr();
  renderPeriod();
}

async function renderPeriod() {
  const dates = periodDates();
  let label;
  if (gridViewMode === "2week") {
    const y = Number(dates[0].slice(0, 4));
    const m = Number(dates[0].slice(5, 7));
    const isFirstHalf = Number(dates[0].slice(8, 10)) === 1;
    label = `${y}年${m}月${isFirstHalf ? "前半(1〜15日)" : "後半(16〜" + dates[dates.length - 1].slice(8,10) + "日)"}`;
  } else {
    label = `${dates[0].slice(0,7)}`;
  }
  document.getElementById("periodLabel").textContent = label;

  const headRow = document.getElementById("periodHeadRow");
  headRow.innerHTML = `<th>スタッフ</th>` + dates.map((d) => {
    const wd = new Date(d + "T00:00:00").getDay();
    const short = `${Number(d.slice(5,7))}/${Number(d.slice(8,10))}`;
    return `<th>${short}</th>`;
  }).join("");

  const body = document.getElementById("periodBody");
  body.innerHTML = `<tr><td colspan="${dates.length+1}" class="muted" style="padding:12px;">読み込み中...</td></tr>`;

  let periodData;
  try {
    periodData = await apiCall(API_URL, "getPeriodData", { startDate: dates[0], endDate: dates[dates.length-1] });
  } catch (e) {
    body.innerHTML = `<tr><td colspan="${dates.length+1}" class="error" style="padding:12px;">読み込みに失敗しました: ${e.message}</td></tr>`;
    return;
  }

  body.innerHTML = "";
  staffList.forEach((s) => {
    const mine = periodData.assigned.filter((a) => a.staffId === s.id);
    const totalHours = mine.reduce((sum, a) => sum + calcHours(a), 0);
    const byDate = {};
    mine.forEach((a) => { byDate[a.date] = a; }); // 同日重複が残っていても最後の1件を優先
    const tr = document.createElement("tr");
    const nameCell = `<td><div class="pname">${s.name}</div><div class="phours">${totalHours.toFixed(1)}時間</div></td>`;
    const cells = dates.map((d) => {
      const a = byDate[d];
      return a ? `<td class="pcell on">${a.start}-${a.end}</td>` : `<td class="pcell"></td>`;
    }).join("");
    tr.innerHTML = nameCell + cells;
    body.appendChild(tr);
  });
  if (staffList.length === 0) {
    body.innerHTML = `<tr><td colspan="${dates.length+1}" class="muted" style="padding:12px;">「スタッフ管理」からスタッフを登録してください</td></tr>`;
  }
}

// 帯の空いている場所をクリックしたときだけ「新規追加」を開く(既存の帯自体のクリックは gasnbar 側の stopPropagation で処理)
function trackClicked(e, staffId, staffName, date) {
  openShiftModal(staffId, staffName, date, null);
}

function openShiftModalById(staffId, staffName, date, assignedId) {
  const asg = currentDayData.assigned.find((a) => String(a.id) === String(assignedId));
  openShiftModal(staffId, staffName, date, asg || null);
}

let modalCtx = null; // { staffId, staffName, date, assignedId }

function openShiftModal(staffId, staffName, date, assigned) {
  modalCtx = { staffId, staffName, date, assignedId: assigned ? assigned.id : null };
  document.getElementById("shiftModalTitle").textContent = staffName + "のシフト(確定)";
  document.getElementById("modalStart").value = assigned ? assigned.start : "10:00";
  document.getElementById("modalEnd").value = assigned ? assigned.end : "18:00";
  const hasBreak = !!(assigned && assigned.breakStart && assigned.breakEnd);
  document.getElementById("modalHasBreak").checked = hasBreak;
  document.getElementById("modalBreakStart").value = assigned && assigned.breakStart ? assigned.breakStart : "";
  document.getElementById("modalBreakEnd").value = assigned && assigned.breakEnd ? assigned.breakEnd : "";
  document.getElementById("modalBreakRow").classList.toggle("hidden", !hasBreak);
  document.getElementById("modalDeleteBtn").classList.toggle("hidden", !assigned);
  document.getElementById("modalError").classList.add("hidden");
  document.getElementById("shiftModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("shiftModal").style.display = "none";
  modalCtx = null;
}

function toggleModalBreak() {
  document.getElementById("modalBreakRow").classList.toggle("hidden", !document.getElementById("modalHasBreak").checked);
}

async function saveFromModal() {
  if (!modalCtx) { closeModal(); return; }
  const start = document.getElementById("modalStart").value;
  const end = document.getElementById("modalEnd").value;
  const hasBreak = document.getElementById("modalHasBreak").checked;
  const breakStart = hasBreak ? document.getElementById("modalBreakStart").value : "";
  const breakEnd = hasBreak ? document.getElementById("modalBreakEnd").value : "";
  const err = document.getElementById("modalError");
  err.classList.add("hidden");
  if (!start || !end || toMin(start) >= toMin(end)) {
    err.textContent = "終了時刻は開始時刻より後にしてください。";
    err.classList.remove("hidden");
    return;
  }
  if (hasBreak && (!breakStart || !breakEnd || toMin(breakStart) >= toMin(breakEnd))) {
    err.textContent = "休憩時間を正しく入力してください。";
    err.classList.remove("hidden");
    return;
  }
  try {
    await apiCall(API_URL, "saveAssigned", {
      id: modalCtx.assignedId || undefined,
      staffId: modalCtx.staffId,
      date: modalCtx.date,
      start, end, breakStart, breakEnd,
    });
    closeModal();
    await renderGrid();
  } catch (e) {
    err.textContent = "通信エラー: " + e.message;
    err.classList.remove("hidden");
  }
}

async function deleteFromModal() {
  if (!modalCtx) { closeModal(); return; }
  const err = document.getElementById("modalError");
  try {
    if (modalCtx.assignedId) {
      await apiCall(API_URL, "deleteAssigned", { id: modalCtx.assignedId });
    }
    closeModal();
    await renderGrid();
  } catch (e) {
    err.textContent = "通信エラー: " + e.message;
    err.classList.remove("hidden");
  }
}

async function changeAdminPw() {
  const pw = document.getElementById("newAdminPw").value;
  if (pw.length < 4) { alert("4文字以上で設定してください"); return; }
  await apiCall(API_URL, "setAdminPassword", { password: pw });
  document.getElementById("newAdminPw").value = "";
  alert("変更しました");
}
async function changePasscode() {
  const code = document.getElementById("newPasscode").value;
  if (code.trim().length < 4) { alert("4文字以上で設定してください"); return; }
  await apiCall(API_URL, "setSetting", { key: "punchPasscode", value: code.trim() });
  document.getElementById("newPasscode").value = "";
  alert("変更しました");
}
